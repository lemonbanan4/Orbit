<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost in space — Orbit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #07040F;
      color: #F3F0FC;
    }
    .planet {
      font-size: 64px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 24px rgba(0, 229, 255, 0.35));
    }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
    p { color: #948FBE; font-size: 15px; line-height: 1.5; max-width: 380px; margin-bottom: 28px; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #F3F0FC;
      transition: all 0.2s ease;
    }
    a:hover { background: rgba(0, 229, 255, 0.1); border-color: #00E5FF; }
    a.primary { background: #00E5FF; color: #051024; border-color: #00E5FF; }
  </style>
</head>
<body>
  <div class="planet">🪐</div>
  <h1>Lost in space</h1>
  <p>This page drifted out of orbit. The link may be old or mistyped — let's get you back on course.</p>
  <div class="links">
    <a class="primary" href="/">Back to Orbit</a>
    <a href="/support">Support</a>
  </div>
</body>
</html>
