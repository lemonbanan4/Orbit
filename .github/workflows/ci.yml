name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: "stable"
      - run: flutter pub get
      # .env is gitignored (holds the real Gemini API key) and declared as a
      # pubspec asset -- on a fresh checkout it doesn't exist, which makes
      # `flutter analyze` fail on an asset_does_not_exist warning before it
      # even gets to real analysis. Neither analyze nor the existing unit
      # tests touch its contents, so a placeholder is enough to satisfy the
      # asset check.
      - run: echo "GEMINI_API_KEY=" > .env
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Cloud Functions build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
