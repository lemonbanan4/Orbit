name: orbit
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  audioplayers: ^6.6.0
  vibration: ^3.1.8
  permission_handler: ^12.0.1
  confetti: ^0.8.0
  provider: ^6.1.2
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  firebase_crashlytics: ^5.1.0
  firebase_analytics: ^12.2.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  firebase_storage: ^13.2.0
  image_picker: ^1.1.2
  purchases_flutter: ^9.15.1
  purchases_ui_flutter: ^9.15.1
  flutter_animate: ^4.5.2
  package_info_plus: ^8.0.0
  video_player: ^2.11.1
  url_launcher: ^6.2.6
  share_plus: ^12.0.2
  flutter_dotenv: ^5.1.0
  home_widget: ^0.9.0
  google_generative_ai: ^0.4.6
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  table_calendar: ^3.1.2
  google_fonts: ^6.3.3
  shake: ^2.2.0
  http: ^1.6.0
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  change_app_package_name: ^1.5.0
  fake_async: ^1.3.1
  mocktail: ^1.0.5
  build_runner: ^2.13.1

dependency_overrides:
  # Force a newer version of sensors_plus that contains the Android namespace fix
  # to prevent the shake package from pulling in the broken v1.4.1
  sensors_plus: ^4.0.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/audio/space_hum.mp3
    - assets/audio/shockwave.mp3
    - assets/audio/lunar_breeze.mp3
    - assets/audio/success_chime.mp3
    - assets/audio/
    - assets/interests/
    - assets/videos/
    - assets/journeygen/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  image_path_ios: "assets/splash_icon.png" # Flattened icon with solid background for iOS
  adaptive_icon_background: "#051024" # Your app's navy blue background
  adaptive_icon_foreground: "assets/icon.png" # The monochrome icon
  remove_alpha_ios: true

flutter_native_splash:
  color: "#051024"
  image: "assets/icon.png"
  android_12:
    color: "#051024"
    image: "assets/icon.png"