# Optimized for a smooth Flutter build without crashing the emulator
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Keep these for speed, but they can sometimes cause "Ghost" bugs
# If the app still crashes, try setting these to false temporarily
org.gradle.parallel=true
org.gradle.daemon=true
# AGP 9 built-in Kotlin: let AGP compile Kotlin for all plugin submodules
# (android.builtInKotlin=false is deprecated in AGP 9 and breaks compilation
# of plugins that rely on KGP — removing that flag restores the default true)
# builtInKotlin=true breaks plugins (audio_service etc.) that apply kotlin-android
# themselves with AGP 9 — AGP throws IllegalStateException. Keep false per AGP 9's
# own recommended workaround. The root build.gradle.kts compensates by explicitly
# applying KGP to Firebase plugin modules whose build files conditionally skip it
# for AGP 9+ (see the "subprojects { afterEvaluate" block there).
android.builtInKotlin=false
# newDsl=true crashes the Flutter Gradle plugin (NPE). Keep false until FlutterFire
# supports it. compileSdk=36 is set explicitly in app/build.gradle.kts anyway.
android.newDsl=false
# Old third-party plugins (audio_session, audioplayers, flutter_tts, etc.) compile
# Java to JVM 11 or 1.8 but KGP 2.2.x defaults Kotlin to JVM 21. Converting the
# mismatch check from an error to a warning lets the build proceed — the resulting
# bytecode is compatible at runtime.
kotlin.jvm.target.validation.mode=warning
